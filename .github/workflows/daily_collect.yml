name: Daily EV Charger Alert System

on:
  schedule:
    # 15:23 UTC = KST 00:23 (심야) — KST 10시대(01:00 UTC)는 API 피크라 재시도 폭증으로 2~4시간 소요,
    # 심야는 ~20분에 완료. 저장 시점이 같은 UTC 날짜라 파일명은 직전 KST 하루의 마감 스냅샷이 됨.
    - cron: '23 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-alert:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 체크아웃
      uses: actions/checkout@v3

    - name: 파이썬 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 라이브러리 설치
      run: |
        pip install requests pandas openpyxl

    - name: 수집 스크립트 실행 (불완전 수집 시 exit 1 → 커밋 단계 스킵)
      env:
        DATA_API_KEY: ${{ secrets.DATA_API_KEY }}
      run: |
        python alert_main.py

    - name: 결과 파일 커밋 및 푸시
      run: |
        git config --global user.name "github-actions-bot"
        git config --global user.email "github-actions-bot@users.noreply.github.com"
        
        # [수정됨] 엑셀, CSV 뿐만 아니라 압축파일(*.gz)도 추가합니다.
        # 이전의 큰 csv 파일은 삭제 목록에 추가합니다.
        git add *.xlsx *.csv *.gz
        
        # 만약 이전의 큰 csv가 남아있다면 제거 (에러 방지용 안전장치)
        if [ -f latest_data.csv ]; then
          git rm --cached latest_data.csv || true
          rm latest_data.csv || true
        fi
        
        git commit -m "Auto-update: Compressed Data & Alerts ($(date +'%Y-%m-%d'))" || echo "No changes to commit"
        git push
