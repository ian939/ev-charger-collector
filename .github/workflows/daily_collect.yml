name: Monthly EV Charger Collect (month-end snapshot)

on:
  schedule:
    # 월 1회 수집: 15:23 UTC = KST 익일 00:23 (심야, API 한가한 시간대).
    # 파일명은 UTC 날짜이므로 'UTC 말일'에 실행해야 그 달의 월말 마감 스냅샷(전기차충전소_YYYYMM말일.xlsx)이 됨.
    # cron은 말일(L)을 표현할 수 없어 28~31일에 기동하고, 아래 '말일 가드'에서 내일이 1일일 때만 수집 실행.
    - cron: '23 15 28-31 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-alert:
    runs-on: ubuntu-latest

    steps:
    - name: 말일 가드 (매월 마지막 날만 수집, 수동 실행은 무조건 수집)
      id: guard
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u -d tomorrow +%d)" = "01" ]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "오늘(UTC $(date -u +%m-%d))이 말일 또는 수동 실행 → 수집 진행"
        else
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "오늘(UTC $(date -u +%m-%d))은 말일 아님 → 스킵"
        fi

    - name: 저장소 코드 체크아웃
      if: steps.guard.outputs.run == 'true'
      uses: actions/checkout@v3

    - name: 파이썬 설정
      if: steps.guard.outputs.run == 'true'
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 라이브러리 설치
      if: steps.guard.outputs.run == 'true'
      run: |
        pip install requests pandas openpyxl

    - name: 수집 스크립트 실행 (불완전 수집 시 exit 1 → 커밋 단계 스킵)
      if: steps.guard.outputs.run == 'true'
      env:
        DATA_API_KEY: ${{ secrets.DATA_API_KEY }}
      run: |
        python alert_main.py

    - name: 결과 파일 커밋 및 푸시
      if: steps.guard.outputs.run == 'true'
      run: |
        git config --global user.name "github-actions-bot"
        git config --global user.email "github-actions-bot@users.noreply.github.com"

        # [수정됨] 엑셀, CSV 뿐만 아니라 압축파일(*.gz)도 추가합니다.
        # 이전의 큰 csv 파일은 삭제 목록에 추가합니다.
        git add *.xlsx *.csv *.gz

        # 만약 이전의 큰 csv가 남아있다면 제거 (에러 방지용 안전장치)
        if [ -f latest_data.csv ]; then
          git rm --cached latest_data.csv || true
          rm latest_data.csv || true
        fi

        git commit -m "Auto-update: Compressed Data & Alerts ($(date +'%Y-%m-%d'))" || echo "No changes to commit"
        git push
